[build]
  functions = "netlify/functions"

[build.environment]
  # These are public config switches, not secrets. Keep scanning enabled for
  # actual credentials such as ADMIN_PASSWORD_HASH, UPSTASH_REDIS_REST_TOKEN,
  # ADMIN_API_KEY, and AUTH_JWT_SECRET.
  SECRETS_SCAN_OMIT_KEYS = "FRONTEND_ORIGIN,ADMIN_FRONTEND_ORIGIN,ADMIN_EMAIL,PORTFOLIO_STORE,PORTFOLIO_REDIS_KEY,UPSTASH_REDIS_REST_URL"

[functions]
  included_files = ["data/portfolio.json"]
  node_bundler = "esbuild"

[dev]
  functions = "netlify/functions"
  port = 8888
